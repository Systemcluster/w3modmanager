[project]
name = "w3modmanager"
description = "Mod manager for The Witcher 3"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
license = { text = "BSD-2-Clause" }
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Christian Sdunek", email = "me@systemcluster.me" }]
keywords = ["witcher-3", "mod-manager", "modding", "games", "w3mm"]
urls = { repository = "https://github.com/Systemcluster/w3modmanager" }

dependencies = [
    "fasteners>=0.19",
    "PySide6>=6.7,<6.8",
    "loguru>=0.7",
    "vdf>=3.4",
    "appdirs>=1.4",
    "pywin32>=306",
    "charset-normalizer>=3.3",
    "httpx>=0.27",
    "qasync>=0.27",
    "dateparser>=1.2",
    "dataclasses-json>=0.6",
    "watchdog>=4.0",
    "xxhash>=3.4",
]

[tool.pdm.resolution]
allow-prereleases = false

[tool.pdm.dev-dependencies]
lint = [
    "ruff>=0.5",
    "pyright>=1.1",
    "types-dateparser>=1.2",
    "autopep8>=2.3",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
build = [
    "pyinstaller>=6.8",
    "invoke>=2.2",
]

[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pyright]
include = ["w3modmanager", "tests", "tasks.py"]
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryCast = "none"
reportUnnecessaryComparison = "none"
reportUnknownVariableType = "none"
reportIncompatibleMethodOverride = "none"
reportMissingParameterType = "none"

[tool.ruff]
output-format = "pylint"
exclude = ["tasks.py"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "ANN",
    "ASYNC",
    "SIM",
    "PIE",
    "S",
    "B",
    "A",
    "C4",
    "ERA",
    "T20",
    "PT",
    "PLC",
    "PLE",
    "PLW",
    "Q",
    "I",
    "UP",
    "DTZ",
    "RUF",
]
ignore = [
    "F403",
    "F405",
    "F541",
    "S101",
    "S303",
    "PT003",
    "ANN101",
    "ANN401",
    "SIM102",
    "SIM108",
    "UP017",
]
unfixable = [
    "ERA001",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "double"
avoid-escape = false

[tool.ruff.lint.isort]
section-order = [
    "future",
    "first-party",
    "local-folder",
    "standard-library",
    "third-party",
]
lines-after-imports = 2
lines-between-types = 1

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.autopep8]
max_line_length = 120
ignore = [
    "E122",
    "E303",
    "E502",
    "W503",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
